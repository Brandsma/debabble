name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # debabble writes paths on all three platforms, so all three are tested.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Check the tool runs end to end
        run: |
          uv run debabble packs
          uv run debabble targets
          uv run debabble render --style minimal
          uv run debabble apply --dry-run

      - name: Check our own writing with our own rules
        run: uv run debabble lint .
