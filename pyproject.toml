[project]
name = "debabble"
version = "0.1.0"
description = "Install curated no-AI-speak writing rules into your AI coding tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "writing", "style", "claude-code", "cursor", "agents-md", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "cyclopts>=3.0",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomlkit>=0.13",
]

[project.scripts]
debabble = "debabble.cli:main"

[project.urls]
Homepage = "https://github.com/brandsma/debabble"
Issues = "https://github.com/brandsma/debabble/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debabble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
