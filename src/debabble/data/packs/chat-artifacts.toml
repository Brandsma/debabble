[pack]
id = "chat-artifacts"
title = "Chat artifacts"
description = "Conversation leakage: assistant preambles, sycophancy, offers of help, and tool markup that escaped into a document."
version = "2026.08"
priority = 100
references = [
    "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing",
    "https://arxiv.org/abs/2604.19139",
]

# This pack is the one category with effectively no false positives: none of
# these strings belong in a document, a comment, or a commit message. It has the
# highest priority, so it is the last pack dropped when output must fit a size
# budget.

[[rules]]
id = "assistant-preamble"
title = "No assistant self-reference"
severity = "ban"
kind = "phrase"
registers = ["prose", "docs", "comments", "commits"]
phrases = [
    "as an AI language model",
    "as an AI assistant",
    "as an AI",
    "as a large language model",
    "I'm just an AI",
    "as of my last update",
    "as of my knowledge cutoff",
    "my training data",
    "based on the information provided",
    "I don't have access to real-time",
]
instruction = "Never refer to yourself as an AI, mention a knowledge cutoff, or hedge about training data. A document has no narrator."
why = "These strings are conversation leakage: they say nothing about the subject and mark the text as pasted from a chat window."
wrong = "As an AI language model, I cannot verify the current version number."
right = "The current version number is not recorded here."

[[rules]]
id = "sycophancy"
title = "No praise for the request"
severity = "ban"
kind = "phrase"
registers = ["prose", "docs", "comments", "commits"]
phrases = [
    "great question",
    "excellent question",
    "that's a great point",
    "excellent point",
    "you're absolutely right",
    "you are absolutely right",
    "you're right to",
    "what a great idea",
    "happy to help",
]
instruction = "Do not open with praise for the question or agreement with the reader. Start with the answer."
why = "Sycophantic openers are the single most recognisable assistant tic, and human evaluations rate them as the least natural thing a model does."
wrong = "Great question! The parser handles this in two passes."
right = "The parser handles this in two passes."

[[rules]]
id = "pseudo-empathy"
title = "No performed understanding"
severity = "ban"
kind = "phrase"
registers = ["prose", "docs", "comments", "commits"]
phrases = [
    "I completely understand your concern",
    "I understand your frustration",
    "I can see why you'd think",
    "I can see why you might",
    "that must be frustrating",
]
instruction = "Do not narrate empathy. Fix the problem or describe it accurately."
wrong = "I completely understand your frustration with this error."
right = "This error means the config file was not found."

[[rules]]
id = "offers-of-help"
title = "No trailing offers of help"
severity = "ban"
kind = "phrase"
registers = ["prose", "docs", "comments", "commits"]
phrases = [
    "I hope this helps",
    "hope that helps",
    "let me know if you",
    "let me know if there's anything",
    "feel free to reach out",
    "feel free to ask",
    "would you like me to",
    "if you have any questions",
    "don't hesitate to",
]
instruction = "Do not end with an offer of further help or an invitation to ask questions. Stop when the content stops."
wrong = "That covers the setup. Let me know if you have any questions!"
right = "That covers the setup."

[[rules]]
id = "placeholders"
title = "No unfilled placeholders"
severity = "ban"
kind = "regex"
registers = ["prose", "docs", "comments", "commits"]
pattern = '\[(?:Your Name|Your Company|Insert [^\]]{1,40}|INSERT[^\]]{0,40}|Name Here|Date Here|X{2,})\]'
instruction = "Never ship a bracketed placeholder. Fill it in, or leave the sentence out."
wrong = "Best regards, [Your Name]"
right = "Best regards, Sam"

[[rules]]
id = "citation-leaks"
title = "No tool or citation markup"
severity = "ban"
kind = "regex"
registers = ["prose", "docs", "comments", "commits"]
pattern = '(?:cite ?turn\d|oai_citation|contentReference|attributableIndex|\[cite: ?\d|grok_render_citation_card_json|ppl-ai-file-upload)'
instruction = "Strip search, citation, and file-upload markup before the text is saved. None of it is readable content."
why = "Leaked markup is proof the text was pasted straight out of a model interface without being read."

[[rules]]
id = "direct-address"
title = "No collaborative asides in documents"
severity = "ban"
kind = "phrase"
registers = ["prose", "docs"]
phrases = [
    "as you can see",
    "as we discussed",
    "you might be wondering",
    "as mentioned earlier",
    "let's take a look at",
    "let's walk through",
    "now let's",
]
instruction = "A document is not a conversation. Drop asides that address the reader as a companion mid-task."
wrong = "As you can see, the cache is checked first. Now let's look at eviction."
right = "The cache is checked first. Eviction runs on a timer."
